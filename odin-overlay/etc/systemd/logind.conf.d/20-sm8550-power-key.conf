# Handheld: power / sleep key → suspend (not immediate shutdown).
# Stock 10-logind-no-powerbutton.conf defers to powerbuttond, but steamvr is
# masked on SM8550 so powerbuttond never starts and the key falls through to
# a hard power-off. This drop-in wins alphabetically over 10-logind-*.
[Login]
HandlePowerKey=suspend
HandlePowerKeyLongPress=poweroff
HandleSuspendKey=suspend
HandleHibernateKey=suspend
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
