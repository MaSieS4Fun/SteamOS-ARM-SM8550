# Frame SteamVR spatializer: vraudiocompositor.so is a dangling
# /run/ladspa symlink. It fails Chromium/Steam streams and leaves speakers silent.
wireplumber.settings = {
  node.stream.enable-spatial-audio = false
  node.stream.enable-spatial-audio-surround = false
}

wireplumber.profiles = {
  main = {
    "steamos.spatial-node-config" = "disabled"
  }
}
