# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
# SM8550 rsinput → virtual Steam Deck (deck-uhid + keyboard for OSK haptics).
#
# Duplicate keys ("a" → "aa") come from rsinput "Gamepad Touchpad" echoing the
# I2C panel — ignore it via 72-sm8550-touch-dedupe.rules (not by dropping keyboard).
#
# Do not list USB/BT as ignore sources: deck-uhid is USB (VID 28de) and
# matching it as a source restarts the composite in a loop (cursor, no Steam).
version: 1
kind: CompositeDevice
name: AYN Odin 2

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYN Odin 2
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYN Odin 2 Mini
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYN Odin 2 Portal
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYN Thor

single_source: false

source_devices:
  - group: gamepad
    evdev:
      phys_path: rsinput-gamepad/input0
      handler: event*
    capability_map_id: ayn_mcu
    passthrough: false

options:
  auto_manage: true

target_devices:
  - deck-uhid
  - keyboard
