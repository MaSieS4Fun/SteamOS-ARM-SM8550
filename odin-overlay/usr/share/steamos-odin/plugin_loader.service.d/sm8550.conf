# PluginLoader runs via Box64 (explicit wrapper). Do not After=home.mount
# (Frame ships a Deck partsets unit that does not exist on SD/UFS).
[Unit]
After=systemd-binfmt.service local-fs.target
Wants=systemd-binfmt.service

[Service]
Environment=USER=steamos
Environment=HOME=/home/steamos
Environment=XDG_CONFIG_HOME=/home/steamos/.config
Environment=XDG_DATA_HOME=/home/steamos/.local/share
Environment=XDG_RUNTIME_DIR=/run/user/1000
Restart=always
RestartSec=5
KillMode=control-group
