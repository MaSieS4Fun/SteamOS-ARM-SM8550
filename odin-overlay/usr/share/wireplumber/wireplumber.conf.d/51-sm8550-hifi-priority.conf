# Stock SM8550 ACP priorities (matches SteamOS-Ubuntu vendor/audio).
device.profile.priority.rules = [
  {
    matches = [
      { device.name = "~alsa_card.platform-sound" }
    ]
    actions = {
      update-props = {
        priorities = [
          "HiFi (Headphones, Speaker)"
          "HiFi (DisplayPort, Speaker)"
          "pro-audio"
        ]
      }
    }
  }
]
