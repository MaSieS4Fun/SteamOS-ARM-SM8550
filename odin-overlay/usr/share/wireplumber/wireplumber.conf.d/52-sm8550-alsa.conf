# Frame 50-alsa-config.conf hides pro-audio and forces quantum 480 /
# period 256. That leaves only a dead DisplayPort sink and PipeWire
# links fail to activate. Restore ACP + buffers that work on SM8550.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.platform-sound" }
    ]
    actions = {
      update-props = {
        api.acp.disable-pro-audio = false
        api.acp.auto-profile = false
        api.acp.auto-port = false
        api.alsa.use-acp = true
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.*" }
    ]
    actions = {
      update-props = {
        audio.channels = 2
        audio.format = "S16LE"
        audio.rate = 48000
        audio.position = "FL,FR"
        api.alsa.period-size = 1024
        api.alsa.headroom = 2048
        node.force-quantum = 512
        priority.session = 800
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.HiFi__Speaker__sink" }
    ]
    actions = {
      update-props = {
        priority.session = 2000
        priority.driver = 2000
        node.description = "Speakers"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.HiFi__DisplayPort__sink" }
    ]
    actions = {
      update-props = {
        priority.session = 200
        priority.driver = 200
        node.description = "DisplayPort"
      }
    }
  }
]
