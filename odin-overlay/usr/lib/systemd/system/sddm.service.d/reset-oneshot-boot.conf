[Unit]
Wants=sm8550-preserve-sddm-session.path
After=sm8550-preserve-sddm-session.path

[Service]
# Keep SteamOS Manager's one-shot session file across an SDDM restart.
# steamos-manager-session-cleanup removes it after the selected graphical
# session starts. Removing it here races Switch to Desktop and makes SDDM
# fall back to gamescope-wayland.desktop.
