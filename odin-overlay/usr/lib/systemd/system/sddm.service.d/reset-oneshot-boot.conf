[Unit]
# Drop leftover one-shot Plasma from the last boot before SDDM autologin.
Wants=sm8550-reset-sddm-session.service
After=sm8550-reset-sddm-session.service
# Keep SteamOS Manager's one-shot session across an SDDM restart in this boot.
Wants=sm8550-preserve-sddm-session.path
After=sm8550-preserve-sddm-session.path

[Service]
# Keep SteamOS Manager's one-shot session file across an SDDM restart.
# steamos-manager-session-cleanup removes it after the selected graphical
# session starts. Removing it here races Switch to Desktop and makes SDDM
# fall back to gamescope-wayland.desktop.
# Reboot still returns to Game Mode: sm8550-reset-sddm-session drops the
# leftover Plasma override unless default_login_mode is Desktop.
