[Unit]
# Frame Requires=hci0.device with no job timeout. On AYN the udev alias
# never appears, so first boot sits on "Set Bluetooth MAC address" until
# a forced power-off. apply-odin-mods also masks this unit.
Requires=
Wants=sys-subsystem-bluetooth-devices-hci0.device

[Service]
TimeoutStartSec=8
SuccessExitStatus=0 1
