[Unit]
Description=Gamescope handheld session
# Drop SteamVR coupling from the Frame image; otherwise gamescope dies with steamvr.
PartOf=
PartOf=graphical-session.target

[Service]
TimeoutStartSec=45
Environment=GAMESCOPE_FORCE_INTERNAL=1
Environment=VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/freedreno_icd.aarch64.json
Environment=VK_DRIVER_FILES=/usr/share/vulkan/icd.d/freedreno_icd.aarch64.json
