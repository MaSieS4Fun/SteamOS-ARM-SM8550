[Unit]
Wants=
After=
After=gamescope-session.service
# Switch to Desktop stops gamescope. Restart=always then respawns Steam
# without Xwayland → "Unable to open a connection to X".
BindsTo=gamescope-session.service
PartOf=gamescope-session.service

[Service]
Restart=on-failure
RestartSec=2
TimeoutStartSec=180
Environment=PATH=/usr/lib/steamos/odin-bin:/usr/bin:/bin
# Qt/CEF on gamescope Xwayland. DisplayManager is Wayland via GAMESCOPE_WAYLAND_DISPLAY.
Environment=QT_QPA_PLATFORM=xcb
Environment=DISPLAY=:0
Environment=GAMESCOPE_WAYLAND_DISPLAY=gamescope-0
Environment=XDG_CURRENT_DESKTOP=gamescope
Environment=XDG_SESSION_DESKTOP=gamescope
Environment=_STEAM_SETENV_MANAGER=1
Environment=SteamDeck=1
UnsetEnvironment=WAYLAND_DISPLAY
UnsetEnvironment=XDG_SESSION_TYPE
# Do not let Frame health-check wipe ~/.local/share/Steam on a 2s miss.
ExecStopPost=
